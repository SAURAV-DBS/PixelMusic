name: Android Release Build

on:
  workflow_dispatch: 
  push:
    branches:
      - main
      - master 
    tags:
      - 'v*' 

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required to allow the bot to push code back to your repo
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create Keystore properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Increment & Save Version Code
        id: code
        run: |
          # Read the current code
          BASE_CODE=$(grep "^APP_VERSION_CODE=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')
          
          # Add 1
          NEW_CODE=$((BASE_CODE + 1))
          
          # Update the file
          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=${NEW_CODE}/" gradle.properties
          
          # Configure Git to act as a bot
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Commit the change. [skip ci] prevents an infinite build loop!
          git add gradle.properties
          git commit -m "chore: bump version code to ${NEW_CODE} [skip ci]" || echo "No changes to commit"
          git push
          
          # Save to environment for later steps
          echo "NEW_CODE=${NEW_CODE}" >> $GITHUB_ENV

      - name: Inject Dynamic Version Name & Set Tag
        id: tag
        run: |
          BASE_VERSION=$(grep "^APP_VERSION_NAME=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            FULL_VERSION=${TAG_NAME#v}
          else
            FULL_VERSION="${BASE_VERSION}.${{ github.run_number }}"
            TAG_NAME="v${FULL_VERSION}"
          fi
          
          # Temporarily change the Version Name just for this build
          sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=${FULL_VERSION}/" gradle.properties
          
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Read Release Notes from File
        run: |
          # Grabs your changelog and appends the current version code to the bottom!
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          if [ -f changelog.txt ]; then
            cat changelog.txt >> $GITHUB_ENV
          else
            echo "New update available. See repository for details." >> $GITHUB_ENV
          fi
          echo -e "\n\n---\n*Current Version Code: ${{ env.NEW_CODE }}*" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: ${{ env.RELEASE_BODY }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          
